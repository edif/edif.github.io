<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>McDog</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      /* Wrapper groups image and menu together as a single centered unit */
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        max-height: 100%;
      }

      .container img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        /* Subtract menu height, gap, and padding so the whole unit never overflows */
        max-height: calc(100dvh - 7.5rem);
        object-fit: contain;
        user-select: none;
      }

      /* Menu acts like a caption attached directly beneath the image */
      .bottom-nav {
        margin-top: 1.25rem;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 1.25rem;
        padding: 0.65rem 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .bottom-nav a {
        color: #8e8e93;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: color 0.2s ease, transform 0.2s ease;
      }

      .bottom-nav a:hover {
        color: #ffffff;
        transform: translateY(-1px);
      }

      /* Dot separator */
      .bottom-nav .dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <img src="logo_closed.png" alt="McDog Logo">

      <nav class="bottom-nav">
        <a href="#about">About</a>
        <span class="dot"></span>
        <a href="#projects">Projects</a>
        <span class="dot"></span>
        <a href="#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
